name: ci

on:
  pull_request:
  push:
    branches: [main]      # post-merge run; the main ruleset does not require PR branches to be up to date
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job name `check` is the required status-check context in the `main` ruleset. It always
  # reports; the expensive toolchain/build/audit steps run only when build-relevant files
  # changed (same conditional pattern as scripts/hooks/pre-push).
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect build-relevant changes
        id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # --no-renames: a *.lean file renamed away must show as a deletion, not only as its destination.
          files=""; decided=false
          if [ "$EVENT" = pull_request ]; then
            files="$(git diff --no-renames --name-only "origin/${BASE_REF}...HEAD")"; decided=true
          elif [ "$EVENT" = push ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE" 2>/dev/null; then
            files="$(git diff --no-renames --name-only "$BEFORE" HEAD)"; decided=true
          fi
          build=true
          if [ "$decided" = true ] && ! printf '%s\n' "$files" \
               | grep -qE '\.lean$|^lakefile|^lean-toolchain$|^lake-manifest\.json$|^scripts/|^\.github/workflows/'; then
            build=false
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "build-relevant changes: $build"; printf '%s\n' "$files" | sed 's/^/  /'

      # Textual guards first: they fail in seconds, before any toolchain download.
      - name: Transient-artefact guard
        run: bash scripts/check-transient-artifacts.sh
      - name: No unmarked sorry/admit
        run: bash scripts/check-no-sorry.sh
      - name: No custom axiom/opaque/unsafe
        run: bash scripts/check-no-custom-axiom.sh

      # Installs elan from lean-toolchain, fetches mathlib oleans, runs `lake build`.
      - name: Build with mathlib cache
        if: steps.changes.outputs.build == 'true'
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false   # .lake of a mathlib project is multi-GB; the mathlib cache is the fast path

      # Same gate as local: guards, no-op rebuild, live #print axioms audit.
      - name: Full gate (scripts/check.sh)
        if: steps.changes.outputs.build == 'true'
        run: bash scripts/check.sh

      - name: Build skipped (no build-relevant changes)
        if: steps.changes.outputs.build != 'true'
        run: echo "No Lean sources, build config, scripts or workflows changed; textual guards passed."
